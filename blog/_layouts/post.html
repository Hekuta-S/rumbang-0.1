---
layout: default
---
<article class="post">
  <header class="post-head">
    {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
  </header>
  {% if page.cover %}
  <img class="cover" src="{{ page.cover | relative_url }}" alt="{{ page.cover_alt | default: page.title }}">
  {% endif %}
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="post-nav">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
  </nav>
</article>
