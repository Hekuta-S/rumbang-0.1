<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"><rect width="1180" height="640" fill="#14111f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99fc9"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5d5d"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#14111f" stroke="#5ee08a" stroke-width="1.5"/></marker><marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#14111f" stroke="#ffd35a" stroke-width="1.5"/></marker></defs><text x="590" y="34" font-size="22" fill="#ff5d5d" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">ANTES — FateDice con dos `match` gigantes y código copiado</text><rect x="40" y="90" width="400" height="256" rx="8" fill="#231d38" stroke="#ff5d5d" stroke-width="2"/><text x="240.0" y="112" font-size="12" fill="#a99fc9" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-style="italic">«Node3D · hace TODO»</text><text x="240.0" y="130" font-size="16" fill="#ff5d5d" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">FateDice</text><line x1="40" y1="138" x2="440" y2="138" stroke="#ff5d5d" stroke-width="1"/><text x="52" y="158" font-size="13" fill="#ff5d5d" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">+ apply(v, p, scene, at)</text><text x="52" y="182" font-size="13" fill="#ff5d5d" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">+ apply12(v, p, scene, at)</text><text x="52" y="206" font-size="13" fill="#ff5d5d" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">- _ambush(p, scene, enc, survival)</text><text x="52" y="230" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">- _heal_full(p)</text><text x="52" y="254" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">- _add_gold(scene, amount)</text><text x="52" y="278" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">+ add_mod(stat, value, seconds…)</text><text x="52" y="302" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">+ roll() / _resolve() / ask()</text><text x="52" y="326" font-size="13" fill="#a99fc9" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">  … ~650 líneas: dado 3D, d12, UI…</text><rect x="820" y="90" width="320" height="112" rx="8" fill="#231d38" stroke="#7c6bb0" stroke-width="2"/><text x="980.0" y="112" font-size="12" fill="#a99fc9" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-style="italic">«otro archivo»</text><text x="980.0" y="130" font-size="16" fill="#f2eefc" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">RunEvents</text><line x1="820" y1="138" x2="1140" y2="138" stroke="#7c6bb0" stroke-width="1"/><text x="832" y="158" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">- _use_shrine(kind)</text><text x="832" y="182" font-size="13" fill="#ff5d5d" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">  match kind: &quot;fury&quot; → add_mod ×2</text><rect x="520" y="100" width="260" height="62" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="532" y="124" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERROR 1 · match v  (6 ramas)</text><text x="532" y="144" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">editar apply() por cada cambio</text><rect x="520" y="180" width="260" height="62" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="532" y="204" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERROR 2 · match v  (12 ramas)</text><text x="532" y="224" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">apply12 ≈ clon de apply</text><rect x="520" y="260" width="260" height="62" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="532" y="284" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERROR 5 · if survival</text><text x="532" y="304" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">dentro de cada rama y _ambush</text><rect x="40" y="350" width="330" height="112" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="52" y="374" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERROR 3 · MALDICIÓN ×3</text><text x="52" y="394" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">apply caso 2</text><text x="52" y="414" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">apply12 caso 1</text><text x="52" y="434" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">apply12 caso 3</text><rect x="400" y="350" width="330" height="112" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="412" y="374" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERROR 4 · FURIA ×4</text><text x="412" y="394" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">apply caso 4 · apply12 casos 7 y 12</text><text x="412" y="414" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">RunEvents (santuario)</text><rect x="760" y="350" width="380" height="112" rx="10" fill="#4a1a22" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="772" y="374" font-size="13" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ERRORES 6-7-8 · duplicados</text><text x="772" y="394" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">curar: inline vs _heal_full()</text><text x="772" y="414" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">oro: inline vs _add_gold()</text><text x="772" y="434" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">regalo: copiado en 2 sitios</text><line x1="440" y1="154" x2="520" y2="131" stroke="#ff5d5d" stroke-width="2" marker-end="url(#arrowred)"/><line x1="440" y1="178" x2="520" y2="211" stroke="#ff5d5d" stroke-width="2" marker-end="url(#arrowred)"/><line x1="440" y1="202" x2="520" y2="291" stroke="#ff5d5d" stroke-width="2" marker-end="url(#arrowred)"/><line x1="250" y1="346" x2="205" y2="350" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/><line x1="330" y1="346" x2="520" y2="350" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/><line x1="980" y1="190" x2="640" y2="350" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/><rect x="40" y="500" width="1100" height="110" rx="10" fill="#231d38" stroke="#ff5d5d" stroke-width="2"/><text x="60" y="530" font-size="16" fill="#ff5d5d" font-weight="bold" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Consecuencia</text><text x="60" y="556" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">• Añadir un resultado nuevo obliga a editar FateDice (viola Abierto/Cerrado).</text><text x="60" y="576" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">• Un arreglo de «furia» hay que repetirlo en 4 sitios: si se olvida uno, los dados se comportan distinto.</text><text x="60" y="596" font-size="13" fill="#f2eefc" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">• Dos tablas paralelas (OUTCOMES/OUTCOMES12 y apply/apply12) que deben mantenerse sincronizadas a mano.</text></svg>